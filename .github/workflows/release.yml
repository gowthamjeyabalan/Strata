name: Release

# Push a tag such as v0.6.1 (matching the version in Cargo.toml) to test, build and publish a
# Windows release with an installer and the portable exe:
#   git tag v0.6.1
#   git push origin v0.6.1
# "Run workflow" on the Actions page does a dry run: it builds and keeps the installer and the exe
# as a downloadable artifact, but publishes no release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "The tag ${{ github.ref_name }} does not match the version $v in Cargo.toml"
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --release --bins

      - name: Build
        run: cargo build --locked --release

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\strata.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item dist/strata-setup-x64.exe .
          Copy-Item target/release/strata.exe .
          foreach ($f in "strata-setup-x64.exe", "strata.exe") {
            # one line with a Unix line end, so `sha256sum -c` reads it too
            [IO.File]::WriteAllText("$PWD/$f.sha256", (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  $f`n")
          }

      - uses: actions/upload-artifact@v4
        with:
          name: strata-windows-x64
          path: |
            strata-setup-x64.exe
            strata-setup-x64.exe.sha256
            strata.exe
            strata.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Strata ${{ steps.version.outputs.version }}
          files: |
            strata-setup-x64.exe
            strata-setup-x64.exe.sha256
            strata.exe
            strata.exe.sha256
          generate_release_notes: true
